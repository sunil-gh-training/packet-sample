name: Sample Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run sample
        run: python app.py | tee sample-output.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-output
          path: sample-output.txt